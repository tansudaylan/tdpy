[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdpy"
version = "1.2"
description = "Numerical and visualization utilities for astrophysical workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "astropy",
  "astroquery",
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "psutil",
  "scikit-learn",
  "scipy",
  "tesswcs",
  "tqdm"
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.4"]
healpix = ["healpy"]

[project.urls]
Homepage = "https://github.com/tansudaylan/tdpy"
Repository = "https://github.com/tansudaylan/tdpy"

[tool.setuptools.packages.find]
include = ["tdpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = ["--import-mode=importlib"]
